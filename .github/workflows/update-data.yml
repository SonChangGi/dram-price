name: Update DRAM price data

on:
  workflow_dispatch:
    # Explicit past dates recover only observations with that original source date.
    inputs:
      target_date:
        description: 'Source price date to collect or recover (YYYY-MM-DD, or today)'
        required: false
        default: 'today'
        type: string
  schedule:
    # 13:15 KST weekdays: collection after the first public spot update at 12:00 KST.
    - cron: "15 4 * * 1-5"
    # 15:15/19:30 KST weekdays: refresh later source sessions even after earlier success.
    - cron: "15 6 * * 1-5"
    - cron: "30 10 * * 1-5"
    # 22:30 KST Monday-Friday: recover an incomplete same-day collection.
    - cron: "30 13 * * 1-5"
    # 01:30/04:30 KST Tuesday-Saturday: recover the preceding price day.
    - cron: "30 16 * * 1-5"
    - cron: "30 19 * * 1-5"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dram-price-pages
  cancel-in-progress: false

jobs:
  update-data:
    # Scheduled-source guards keep provider outages visible in logs without
    # publishing partial data. A separate public-site health job is the only
    # scheduled failure-mail gate; manual dispatch stays fail-fast.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Decide whether collection is needed
        id: freshness
        env:
          PYTHONPATH: src
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TARGET: ${{ inputs.target_date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          test -n "$run_created_at"
          args=(--status data/status.json --prices data/prices.json --timezone Asia/Seoul --minimum-daily-spot-rows 7 --require-known-spot-products --now "$run_created_at")
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=(--schedule "$SCHEDULE")
          fi
          # A failed attempt still needs recovery even when last-good prices are current.
          needs_recovery="$(python - <<'PYHEALTH'
          import json
          from pathlib import Path
          try:
              health = json.loads(Path("data/automation-health.json").read_text())
              healthy = isinstance(health, dict) and health.get("status") == "ok"
          except (OSError, ValueError):
              healthy = False
          print("false" if healthy else "true")
          PYHEALTH
          )"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$needs_recovery" = "true" ]; then
            args+=(--force)
          fi
          args+=(--require-daily-date "${MANUAL_TARGET:-today}")
          python -m dram_tracker.freshness "${args[@]}" | tee "$GITHUB_OUTPUT"
      - name: Report freshness decision
        run: |
          echo "should_collect=${{ steps.freshness.outputs.should_collect }}"
          echo "reason=${{ steps.freshness.outputs.reason }}"
          echo "today=${{ steps.freshness.outputs.today }}"
          echo "generated_at=${{ steps.freshness.outputs.generated_at }}"
          echo "target_date=${{ steps.freshness.outputs.target_date }}"
          echo "daily_observation_count=${{ steps.freshness.outputs.daily_observation_count }}"
          echo "minimum_source_time=${{ steps.freshness.outputs.minimum_source_time }}"
      - name: Prepare isolated collection candidate
        if: steps.freshness.outputs.should_collect == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dram-candidate"
          cp -R data/. "$RUNNER_TEMP/dram-candidate/"
      - name: Collect public DRAM data
        id: collect
        if: steps.freshness.outputs.should_collect == 'true'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          PYTHONPATH: src
        run: python -m dram_tracker.collect --output "$RUNNER_TEMP/dram-candidate" --attempt-status "$RUNNER_TEMP/dram-attempt-status.json" --target-date "${{ steps.freshness.outputs.target_date }}" --history-dir history/trendforce-spot
      - name: Report scheduled collection failure
        if: steps.collect.outcome == 'failure' && github.event_name == 'schedule'
        run: |
          echo "::warning::Scheduled DRAM collection failed; keeping the last published data and suppressing run-failed mail."
      - name: Verify requested daily data after collection
        id: verify_target_date
        if: steps.freshness.outputs.should_collect == 'true' && steps.collect.outcome == 'success' && steps.freshness.outputs.target_date != ''
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          PYTHONPATH: src
        run: |
          python -m dram_tracker.freshness \
            --status "$RUNNER_TEMP/dram-candidate/status.json" \
            --prices "$RUNNER_TEMP/dram-candidate/prices.json" \
            --timezone Asia/Seoul \
            --minimum-daily-spot-rows 7 --require-known-spot-products \
            --require-daily-date "${{ steps.freshness.outputs.target_date }}" \
            --minimum-source-time "${{ steps.freshness.outputs.minimum_source_time }}" \
            --fail-if-collect-needed
      - name: Report scheduled target-date miss
        if: steps.verify_target_date.outcome == 'failure' && github.event_name == 'schedule'
        run: |
          echo "::warning::Scheduled collection finished, but target date ${{ steps.freshness.outputs.target_date }} is still missing; keeping the last published data and skipping commit/deploy."
      - name: Run tests
        id: tests
        if: steps.freshness.outputs.should_collect == 'true' && steps.collect.outcome == 'success' && (steps.freshness.outputs.target_date == '' || steps.verify_target_date.outcome == 'success')
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          npm ci --prefix frontend
          npm run verify --prefix frontend
      - name: Report scheduled test failure
        if: steps.tests.outcome == 'failure' && github.event_name == 'schedule'
        run: |
          echo "::warning::Scheduled validation failed after collection; keeping the last published data and skipping commit/deploy."
      - name: Validate public data publication floor
        id: publication
        if: steps.freshness.outputs.should_collect == 'true' && steps.collect.outcome == 'success' && (steps.freshness.outputs.target_date == '' || steps.verify_target_date.outcome == 'success') && steps.tests.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          PYTHONPATH: src
        run: python scripts/validate_publication.py --data-dir "$RUNNER_TEMP/dram-candidate"
      - name: Update persistent automation health
        id: health
        if: always() && steps.freshness.outputs.should_collect == 'true'
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          TARGET_OUTCOME: ${{ steps.verify_target_date.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          TARGET_DATE: ${{ steps.freshness.outputs.target_date }}
        run: |
          python scripts/update_automation_health.py \
            --state data/automation-health.json \
            --status "$RUNNER_TEMP/dram-attempt-status.json" \
            --collection-outcome "${COLLECTION_OUTCOME:-skipped}" \
            --target-outcome "${TARGET_OUTCOME:-skipped}" \
            --tests-outcome "${TESTS_OUTCOME:-skipped}" \
            --publication-outcome "${PUBLICATION_OUTCOME:-skipped}" \
            --target-date "${TARGET_DATE:-}"
      - name: Promote verified candidate
        id: promote
        if: steps.freshness.outputs.should_collect == 'true' && steps.collect.outcome == 'success' && (steps.freshness.outputs.target_date == '' || steps.verify_target_date.outcome == 'success') && steps.tests.outcome == 'success' && steps.publication.outcome == 'success' && steps.health.outcome == 'success'
        run: |
          for artifact in prices.json series.json status.json summary.json; do
            cp "$RUNNER_TEMP/dram-candidate/$artifact" "data/$artifact"
          done
      - name: Commit data changes
        id: data_commit
        if: steps.freshness.outputs.should_collect == 'true' && steps.collect.outcome == 'success' && (steps.freshness.outputs.target_date == '' || steps.verify_target_date.outcome == 'success') && steps.tests.outcome == 'success' && steps.publication.outcome == 'success' && steps.health.outcome == 'success' && steps.promote.outcome == 'success'
        run: |
          git add data
          if [ -d history/trendforce-spot ]; then
            git add history/trendforce-spot
          fi
          if git diff --cached --quiet -- data history/trendforce-spot; then
            echo "No data or source-history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Preserve current DRAM observations" \
            -m "Constraint: scheduled/manual public-source refresh must pass freshness, test, and publication gates" \
            -m "Confidence: high" \
            -m "Scope-risk: narrow" \
            -m "Directive: keep source caveats and status evidence with data refreshes" \
            -m "Tested: python -m dram_tracker.freshness --fail-if-collect-needed and python -m unittest discover -s tests -v after collection" \
            -m "Skip-Pages-Deploy: update-data-workflow"
          git push
      - name: Commit automation health without partial market data
        id: health_commit
        if: always() && steps.health.outcome == 'success' && steps.freshness.outputs.should_collect == 'true' && (steps.collect.outcome != 'success' || (steps.freshness.outputs.target_date != '' && steps.verify_target_date.outcome != 'success') || steps.tests.outcome != 'success' || steps.publication.outcome != 'success')
        run: |
          git add data/automation-health.json
          if [ -d history/trendforce-spot ]; then
            git add history/trendforce-spot
          fi
          if git diff --cached --quiet -- data/automation-health.json history/trendforce-spot; then
            echo "No automation health or source-history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Record DRAM automation degradation" \
            -m "Constraint: Preserve the last verified market data while tracking repeated provider or validation failures." \
            -m "Directive: Escalate only after the persisted alert threshold is reached."
          git push
      - name: Verify last-good data for health-only publication
        id: health_frontend
        if: ${{ !cancelled() && steps.health_commit.outcome == 'success' && steps.promote.outcome == 'skipped' && (steps.tests.outcome == 'skipped' || steps.tests.outcome == 'success') }}
        env:
          PYTHONPATH: src
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          # Only automation health changed; no failed candidate can enter this artifact.
          git diff --exit-code -- data/prices.json data/series.json data/status.json data/summary.json
          python scripts/validate_publication.py
          if [ "$TESTS_OUTCOME" != "success" ]; then
            python -m unittest discover -s tests -v
            npm ci --prefix frontend
            npm run verify --prefix frontend
          fi
      - name: Prepare static site
        id: site
        if: ${{ !cancelled() && ((steps.freshness.outputs.should_collect == 'true' && steps.collect.outcome == 'success' && (steps.freshness.outputs.target_date == '' || steps.verify_target_date.outcome == 'success') && steps.tests.outcome == 'success' && steps.publication.outcome == 'success' && steps.health.outcome == 'success' && steps.promote.outcome == 'success' && steps.data_commit.outcome == 'success') || steps.health_frontend.outcome == 'success') }}
        env:
          PYTHONPATH: src
        run: |
          mkdir -p frontend/dist/data
          cp -R data/. frontend/dist/data/
          python scripts/validate_publication.py --data-dir frontend/dist/data
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages_configure
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        id: pages_upload
        if: ${{ !cancelled() && steps.site.outcome == 'success' && steps.pages_configure.outcome == 'success' }}
        with:
          path: frontend/dist
      - id: deployment
        if: ${{ !cancelled() && steps.site.outcome == 'success' && steps.pages_upload.outcome == 'success' }}
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live public data bytes
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            matched=true
            for relative_path in data/prices.json data/series.json data/status.json data/summary.json data/automation-health.json; do
              readback="/tmp/dram-${relative_path//\//-}"
              if ! curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                || ! cmp --silent "frontend/dist/${relative_path}" "$readback"; then
                matched=false
                break
              fi
            done
            if [[ "$matched" == "true" ]]; then
              echo "Live DRAM public data is byte-identical to the deployed artifact."
              exit 0
            fi
            [[ $attempt -lt 12 ]] || exit 1
            sleep 5
          done
      - name: Record repeated automation degradation
        if: >-
          always() &&
          steps.health.outputs.alert_required == 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 19 * * 1-5')
        run: |
          echo "::warning::DRAM automation degradation reached the persisted alert threshold."
          echo "warning_streak=${{ steps.health.outputs.warning_streak }}"
          echo "blocking_streak=${{ steps.health.outputs.blocking_streak }}"
          exit 1

  public-site-health:
    needs: update-data
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Fail only when the existing DRAM page is unusable
        env:
          PAGE_URL: https://sonchanggi.github.io/dram-price/
        shell: bash
        run: |
          set -u
          required_paths=(index.html data/summary.json data/prices.json)
          for attempt in {1..12}; do
            usable=true
            for relative_path in "${required_paths[@]}"; do
              readback="$RUNNER_TEMP/dram-health-${relative_path//\//-}"
              if ! curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --connect-timeout 10 \
                --max-time 120 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"; then
                usable=false
                break
              fi
              if [[ ! -s "$readback" ]]; then
                usable=false
                break
              fi
              if [[ "$relative_path" == "index.html" ]] && ! grep -Eiq '<!doctype html|<html' "$readback"; then
                usable=false
                break
              fi
              if [[ "$relative_path" == *.json ]] && ! jq -e 'type == "object" and length > 0' "$readback" >/dev/null; then
                usable=false
                break
              fi
            done
            if [[ "$usable" == "true" ]]; then
              echo "The existing DRAM page remains usable; scheduled refresh errors stay in run logs without failure mail."
              exit 0
            fi
            [[ $attempt -lt 12 ]] && sleep 10
          done
          echo "::error::The public DRAM page or its required JSON is unavailable or invalid."
          exit 1
