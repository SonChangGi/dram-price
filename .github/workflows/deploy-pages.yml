name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dram-price-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Manual data refreshes deploy from update-data.yml after collection succeeds.
    # This guard skips only commits explicitly marked as already deployed by update-data.yml.
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, 'Skip-Pages-Deploy: update-data-workflow') == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate backend and public data
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_publication.py
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify and build frontend
        run: npm run verify --prefix frontend
      - name: Combine frontend build and public data
        run: |
          mkdir -p frontend/dist/data
          cp -R data/. frontend/dist/data/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live public data bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            matched=true
            for relative_path in data/prices.json data/series.json data/status.json data/summary.json data/automation-health.json; do
              readback="/tmp/dram-${relative_path//\//-}"
              if ! curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                || ! cmp --silent "frontend/dist/${relative_path}" "$readback"; then
                matched=false
                break
              fi
            done
            if [[ "$matched" == "true" ]]; then
              echo "Live DRAM public data is byte-identical to the deployed artifact."
              exit 0
            fi
            [[ $attempt -lt 12 ]] || exit 1
            sleep 5
          done
